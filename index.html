    <!-- Consent Mode v2 — moet staan VOORDAT Google Tag Manager laadt,
         anders kan GTM al tags vuren voordat de standaardtoestemming
         gezet is. Alles staat daarom op 'denied' tot de keuze uit de
         banner binnenkomt; wat de bezoeker eerder koos, wordt hier
         meteen hersteld.

         wait_for_update geeft de banner een halve seconde om een bewaarde
         keuze door te geven voordat Google metingen wegschrijft. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        wait_for_update: 500
      });

      try {
        if (localStorage.getItem('ainova-cookies') === 'granted') {
          gtag('consent', 'update', {
            ad_storage: 'granted',
            ad_user_data: 'granted',
            ad_personalization: 'granted',
            analytics_storage: 'granted'
          });
        }
      } catch (e) {
        // localStorage kan geblokkeerd zijn; dan blijft alles geweigerd.
      }
    </script>
